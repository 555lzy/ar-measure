name: Build ARMeasure APK

on:
  push:
    branches: [ main, 'arena/**' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build debug APK
        run: |
          set +e
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/gradle-build.log"
          build_status=${PIPESTATUS[0]}
          if [ "$build_status" -ne 0 ]; then
            summary=$(tail -n 60 "$RUNNER_TEMP/gradle-build.log" | tr '\r' ' ' | sed 's/%/%25/g')
            summary=${summary//$'\n'/%0A}
            echo "::error title=Gradle build details::$summary"
            exit "$build_status"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ARMeasure-debug-apk
          path: app/build/outputs/apk/debug/*.apk
